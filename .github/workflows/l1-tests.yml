name: Westeros GL BRCM L1 tests and coverage

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Workflow source invoking this L1 workflow."
        required: true
        type: string

permissions:
  contents: read

jobs:
  westeros-gl-brcm-l1:
    name: Build, test, and measure westeros-gl-brcm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcovr libgtest-dev

      - name: Configure instrumented test build
        run: cmake -S L1 -B L1/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build L1 tests
        run: cmake --build L1/build --parallel "$(nproc)"

      - name: Run L1 tests
        run: ctest --test-dir L1/build --output-on-failure
        env:
          GTEST_OUTPUT: xml:${{ github.workspace }}/L1/build/westeros_gl_brcm_test_results.xml

      - name: Generate production-source coverage report
        run: cmake --build L1/build --target coverage --parallel

      - name: Upload L1 test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L1-westeros-gl-brcm
          path: |
            L1/build/westeros_gl_brcm_test_results.xml
            L1/build/coverage_html/
            L1/build/coverage.xml
            L1/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 30
