name: L1 tests trigger

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Workflow source invoking component tests."
        required: true
        type: string
  push:
    branches: [main, develop, 'sprint/**', 'release/**']
  pull_request:
    branches: [main, develop, 'sprint/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  westeros-gl-brcm-l1:
    name: L1 tests (westeros-gl-brcm)
    uses: ./.github/workflows/l1-tests.yml
    with:
      caller_source: local
